<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elbow Production Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1f20; --paper:#f2f2f3; --surface:#e9e9ea; --white:#fff; --field:#f5f5f8;
  --line:rgba(29,31,32,.16); --line-strong:rgba(29,31,32,.3); --line-soft:rgba(29,31,32,.14);
  --muted:#5d5d60; --muted-2:#7a7a7d; --faint:#98989b;
  --steel:#416180; --steel-tint:#eef6ff; --steel-edge:#94bce3;
  --red:#EE1C24; --red-dark:#BB1219; --red-tint:#fde8e9;
  --amber:#9a6a00; --amber-tint:#fff4d6; --amber-edge:#e0b84a;
  --ok:#2E7D52; --on-ink:#fff;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Condensed","Barlow",system-ui,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#e8e8ea; --paper:#17191a; --surface:#202324; --white:#25292b; --field:#1d2022;
  --line:rgba(232,232,234,.14); --line-strong:rgba(232,232,234,.28); --line-soft:rgba(232,232,234,.1);
  --muted:#b4b4b8; --muted-2:#9a9a9e; --faint:#7d7d81;
  --steel:#8fb3d9; --steel-tint:#1f2c3a; --steel-edge:#4f6f8f;
  --red-tint:#3a1c1e; --amber:#e8b43a; --amber-tint:#352b12; --amber-edge:#8a6a1c; --ok:#6fc28f; --on-ink:#17191a;
}}
:root[data-theme="dark"]{
  --ink:#e8e8ea; --paper:#17191a; --surface:#202324; --white:#25292b; --field:#1d2022;
  --line:rgba(232,232,234,.14); --line-strong:rgba(232,232,234,.28); --line-soft:rgba(232,232,234,.1);
  --muted:#b4b4b8; --muted-2:#9a9a9e; --faint:#7d7d81;
  --steel:#8fb3d9; --steel-tint:#1f2c3a; --steel-edge:#4f6f8f;
  --red-tint:#3a1c1e; --amber:#e8b43a; --amber-tint:#352b12; --amber-edge:#8a6a1c; --ok:#6fc28f; --on-ink:#17191a;
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100%}
h1,h2,h3{font-family:var(--cond);margin:0}
button,input,label{font-family:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
::selection{background:rgba(89,128,166,.3)}
img{max-width:100%}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.app{display:flex;flex-direction:column;min-height:100vh}

/* registration marks */
.bp{position:relative;border:1px solid var(--line)}
.bp>i{position:absolute;width:11px;height:11px;color:var(--line-strong);z-index:2;pointer-events:none}
.bp>i::before,.bp>i::after{content:"";position:absolute;background:currentColor}
.bp>i::before{left:5px;top:0;width:1px;height:100%}
.bp>i::after{top:5px;left:0;width:100%;height:1px}
.bp>i.tl{top:-6px;left:-6px}.bp>i.tr{top:-6px;right:-6px}.bp>i.bl{bottom:-6px;left:-6px}.bp>i.br{bottom:-6px;right:-6px}

/* header (stays white, like the tracker) */
header{background:#fff;border-bottom:3px solid var(--red);padding:14px 24px 14px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px 24px}
.brand{width:200px;justify-self:start}
.brand img{width:200px;height:auto;display:block}
.brand .wordmark{margin-top:8px;border-top:1px solid rgba(29,31,32,.22);padding-top:7px;font-family:var(--cond);font-weight:600;font-size:16px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;color:#424244;text-align:center}
@media (max-width:900px){header{grid-template-columns:1fr auto}.steps{grid-column:1/-1;grid-row:2;justify-self:center}}
.steps{display:flex;align-items:center;list-style:none;margin:0;padding:0;justify-self:center}
.steps li{display:flex;align-items:center;gap:9px;font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#98989b;white-space:nowrap}
.steps li+li::before{content:"";width:40px;height:1px;background:rgba(29,31,32,.22);margin:0 14px}
.steps li b{width:28px;height:28px;display:grid;place-items:center;border:1px solid rgba(29,31,32,.28);font-family:var(--mono);font-weight:700;font-size:12px;color:#98989b;background:#fff}
.steps li.now{color:#1d1f20}
.steps li.now b{background:#1d1f20;border-color:#1d1f20;color:#fff}
.steps li.done{color:#1d1f20}
.steps li.done b{border-color:#1d1f20;color:#1d1f20;font-size:0}
.steps li.done b::after{content:"✓";font-size:13px}
.steps li.done+li::before{background:#1d1f20}
@media (max-width:700px){.steps:not(.big) li+li::before{width:18px;margin:0 8px}.steps:not(.big) li span{display:none}}
.header-actions{display:flex;align-items:flex-start;gap:12px;justify-self:end}
.import-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:1px solid #1d1f20;background:transparent;color:#1d1f20;font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:0}
.import-btn:hover{background:#1d1f20;color:#fff}
.lock-btn{min-height:44px;padding:0 14px;border:1px solid rgba(29,31,32,.22);background:transparent;color:#7a7a7d;font-weight:500;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:0}
.lock-btn:hover{color:#1d1f20;border-color:#1d1f20}
.updated-note{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#7a7a7d;text-align:center;margin-top:6px;font-variant-numeric:tabular-nums}
.updated-note.off{color:#BB1219}

/* KPI strip */
.kpis{display:flex;align-items:stretch;background:var(--surface);border-bottom:1px solid var(--line);padding:0 24px;flex-wrap:wrap}
.kpi{padding:11px 26px 11px 0;margin-right:26px;border-right:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
.kpi:last-child{border-right:0;margin-right:0}
.kpi b{font-family:var(--cond);font-weight:600;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi.alert b{color:var(--red)}

/* layout */
main{flex:1;display:flex;align-items:stretch;width:100%}
.rail{width:212px;flex-shrink:0;border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:20px}
.panel{flex:1;min-width:0;padding:20px 24px 70px}
@media (max-width:900px){
  main{flex-direction:column}
  .rail{width:auto;border-right:0;border-bottom:1px solid var(--line)}
  .tabs{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .tab-btn+.tab-btn{border-top:0!important}
  .tab-btn{border-bottom:1px solid var(--ink)!important}
  .panel{padding:16px 14px 60px}
}
.rail-label{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-bottom:8px}
.tabs{display:flex;flex-direction:column;border:1px solid var(--ink)}
.tab-btn{min-height:46px;padding:0 14px;border:none;border-radius:0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;text-align:left;background:var(--white);color:var(--muted)}
.tab-btn+.tab-btn{border-top:1px solid var(--ink)}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{background:var(--ink);color:var(--on-ink)}
.tab-btn:disabled{cursor:default;color:var(--faint)}
.mark{font-family:var(--mono);font-weight:700;font-size:12px;min-width:16px;text-align:right}
.mark.done{color:var(--ok)}.mark.fix{color:var(--red)}.mark.check{color:var(--amber)}.mark.skip{color:var(--faint)}
.tab-btn.active .mark{color:var(--on-ink)}
.mark.busy{width:12px;height:12px;min-width:12px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tab-end{display:inline-flex;align-items:center;gap:8px}
.caret{font-size:10px;line-height:1}
.tab-fixes{border-top:1px solid var(--ink);background:var(--white);padding:2px 0 6px;box-shadow:inset 3px 0 0 var(--red)}
.tab-fixes .fx-head{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);padding:8px 12px 4px 14px}
.tab-fixes button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 12px 7px 14px;cursor:pointer;font-size:12.5px;line-height:1.35;color:var(--ink)}
.tab-fixes button:hover{background:var(--field)}
.tab-fixes button:disabled{cursor:default;background:none}
.tab-fixes b{display:block;font-family:var(--cond);font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--red-dark)}
@media (max-width:900px){.tab-fixes{grid-column:1/-1;border-bottom:1px solid var(--ink)}}
.rail .save-btn{width:100%}
.rail-note{font-size:10.5px;line-height:1.6;color:var(--muted-2);border-top:1px solid var(--line);padding-top:14px}
.rail-note:empty{display:none}

/* buttons */
.save-btn{min-height:46px;padding:0 26px;border:1px solid var(--red-dark);background:var(--red);color:#fff;font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:0}
.save-btn:hover{background:var(--red-dark)}
.save-btn:disabled{opacity:.4;cursor:default;background:var(--red)}
.ghost-btn{min-height:40px;padding:0 16px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:500;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;border-radius:0;display:inline-flex;align-items:center;gap:8px}
.ghost-btn:hover{background:var(--ink);color:var(--on-ink)}
.quiet-btn{min-height:46px;padding:0 20px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:0}
.quiet-btn:hover{background:var(--surface)}
.text-btn{border:0;background:none;padding:0 2px;color:var(--steel);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.status-pill{border:1px solid var(--ok);color:var(--ok);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;padding:5px 10px;display:inline-block}

/* upload */
.import-prompt{border:1px dashed var(--line-strong);padding:58px 20px 50px;text-align:center;color:var(--muted-2);background:var(--white);cursor:pointer;display:block}
.import-prompt:hover,.import-prompt.over{border-color:var(--red)}
.import-prompt.over{background:var(--field)}
.import-prompt .big{font-family:var(--cond);font-weight:600;font-size:24px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);display:block}
.import-prompt .sub{font-size:12px;display:block;margin-top:4px}
.import-prompt svg{width:42px;height:42px;color:var(--red);margin-bottom:10px}
.files{list-style:none;margin:14px 0 0;padding:0}
.files:not(:empty){border-top:1px solid var(--line-strong)}
.files li{display:flex;align-items:center;gap:14px;padding:9px 2px;border-bottom:1px solid var(--line-soft)}
.files .fn{font-family:var(--mono);font-weight:700;font-size:13.5px;flex:1;overflow-wrap:anywhere}
.files .fk{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.files .fk.guess{color:var(--amber);font-weight:600}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;color:var(--faint);cursor:pointer;border-radius:0;padding:0;font-size:18px;line-height:1}
.icon-btn:hover{color:var(--red);border-color:rgba(238,28,36,.4)}
.action-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.save-note{font-size:11.5px;color:var(--muted-2);flex:1;min-width:200px}
.note{background:var(--white);border-left:3px solid var(--steel);padding:11px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.55}
.note.red{border-left-color:var(--red)}
.note.amber{border-left-color:var(--amber-edge)}
.note b{font-weight:600}
.note ol{margin:6px 0 0;padding-left:18px}
.note .text-btn{margin-left:6px}

/* date */
.date-card{background:var(--white);max-width:420px;margin:24px auto 0;padding:30px 30px 26px;text-align:center}
.date-card .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2)}
.date-card .day-of{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin-top:8px}
.date-card .day-files{font-family:var(--mono);font-size:11.5px;color:var(--muted-2);margin-top:2px;overflow-wrap:anywhere}
.date-card .dv{font-family:var(--mono);font-weight:700;font-size:44px;line-height:1.1;margin:10px 0 20px;font-variant-numeric:tabular-nums}
.date-card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.date-card input{min-height:46px;width:170px;padding:0 10px;border:1px solid var(--line-strong);border-radius:0;font-family:var(--mono);font-weight:700;font-size:18px;text-align:center;background:var(--field)}
.date-card input:focus{border-color:var(--steel)}
.date-card input.bad{border-color:var(--red)}
.date-card h2{font-size:19px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.date-card p,.date-card ol{font-size:12.5px;color:var(--muted);text-align:left;margin:0 0 14px}
.date-card ol{padding-left:18px}
.date-card .note{text-align:left;margin:18px 0 0}
.progress{max-width:640px;margin:22px auto 0}
.progress:not(:empty){border-top:1px solid var(--line-strong)}
.progress .pr{display:flex;align-items:center;gap:14px;padding:9px 2px;border-bottom:1px solid var(--line-soft);font-size:13px}
.progress .pn{font-family:var(--mono);font-weight:700;width:58px}
.progress .pw{flex:1;color:var(--muted)}
.progress .pw.err{color:var(--red-dark)}

/* review */
.detail-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 20px;flex-wrap:wrap;margin-bottom:16px}
.facts{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fact{display:block}
.fact .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-bottom:5px}
.fact .v,.fact input.bender{height:42px;min-width:72px;margin:0;padding:0 14px;border:1px solid var(--line-strong);border-radius:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink)}
.fact .v{background:var(--field)}
.fact input.bender{width:72px;text-align:center;background:var(--white)}
.fact input.bender:focus{border-color:var(--steel)}
.seg{display:flex;height:42px;border:1px solid var(--ink)}
.seg button{height:40px;padding:0 16px;border:0;border-radius:0;background:var(--white);font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.head-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-left:auto}
.head-actions .save-btn,.head-actions .quiet-btn{min-height:42px}
.head-actions .save-note{flex:none;min-width:0;text-align:right}
.head-actions .status-pill{display:inline-flex;align-items:center;min-height:42px;padding:0 12px}
.scan{background:#fff;margin:0 0 18px}
.scan .tools{position:absolute;top:10px;right:10px;z-index:3;display:flex;gap:6px}
.scan .tools .ghost-btn{min-height:32px;padding:0 12px;background:rgba(255,255,255,.94);color:#1d1f20;border-color:#1d1f20;font-size:10.5px}
.scan .tools .ghost-btn:hover{background:#1d1f20;color:#fff}
.scan.collapsed{min-height:52px;background:var(--field)}
.scan img{display:block;width:100%;cursor:zoom-in}
.scan .none{padding:16px;color:var(--muted-2);text-align:center;font-size:12px;background:var(--field)}
.card{background:var(--white);padding:18px 20px;margin-bottom:16px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
h2.section-label{font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink);font-weight:600;margin:0}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted-2)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:11px;height:11px;display:inline-block;border:1px solid var(--line-strong)}
.key i.c{background:var(--faint);border-color:var(--faint)}.key i.e{background:var(--steel);border-color:var(--steel)}
.key i.w{background:var(--amber-tint);border-color:var(--amber-edge)}.key i.b{background:var(--red-tint);border-color:var(--red)}
.tw{overflow-x:auto}
table.grid{width:100%;min-width:900px;border-collapse:collapse;font-variant-numeric:tabular-nums}
.grid th{text-align:left;font-weight:600;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 6px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.grid th.num,.grid td.num{text-align:right}
.grid td{border-bottom:1px solid var(--line-soft);padding:2px;height:38px}
.grid tr.empty td{opacity:.45}
.grid tr.empty:focus-within td{opacity:1}
.grid td.star{width:18px;padding:0;text-align:center;color:var(--amber);font-size:12px}
.grid tr.has-block td.star{color:var(--red)}
.grid td.hr{width:32px;font-family:var(--mono);font-size:12px;color:var(--muted-2);padding-left:4px}
.grid td.time{width:76px;font-size:13px;color:var(--muted);white-space:nowrap}
.grid input{width:100%;min-height:34px;border:1px solid transparent;border-radius:0;background:transparent;padding:0 6px;font-size:14px;font-weight:500;color:var(--ink)}
.grid td.num input{text-align:right}
.grid input.mono{font-family:var(--mono);font-weight:700;font-size:13px}
.grid input:hover{border-color:var(--line)}
.grid input:focus{border-color:var(--steel);background:var(--white);outline:2px solid var(--steel-tint);outline-offset:0}
.grid input.carried{color:var(--faint)}
.grid input.edited{color:var(--steel);font-weight:700}
.grid input.warn{background:var(--amber-tint);border-color:var(--amber-edge)}
.grid input.block{background:var(--red-tint);border-color:var(--red)}
.grid input.bad{border-color:var(--red);outline:2px solid var(--red-tint);outline-offset:0}
.grid input::placeholder{color:var(--red-dark);font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.grid .ro{display:block;padding:0 6px;font-size:14px;color:var(--muted)}
.c-item{min-width:140px}.c-dia{width:84px}.c-std{width:58px}.c-wall{width:58px}.c-deg{width:76px}.c-rad{width:70px}.c-pcs{width:72px}.c-rej{width:74px}.c-order{width:112px}.c-time{width:96px}
.issues{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-strong)}
.issues button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-soft);background:none;padding:9px 2px;cursor:pointer;font-size:14px;color:var(--ink)}
.issues button:hover{background:var(--field)}
.issues button:disabled{cursor:default;background:none}
.issues .who{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;min-width:92px;color:var(--red-dark)}
.issues .dash{color:var(--faint)}
#fixcard{border-left:3px solid var(--red)}
.scanbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px}

.edit-btn{min-height:28px;padding:0 10px;border:1px solid var(--line-strong);background:var(--white);font-family:var(--cond);font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);cursor:pointer;border-radius:0}
.edit-btn:hover{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
table.log td.act{width:1%;white-space:nowrap;padding:4px 6px}
.save-btn.addrec{min-height:38px;padding:0 16px;font-size:13px}
.editcard{border-top:3px solid var(--ink);margin-bottom:14px}
.editgrid .wide2{grid-column:span 2}
.editgrid select{min-height:38px;border:1px solid var(--line-strong);border-radius:0;background:var(--white);padding:0 8px;font-family:var(--mono);font-size:13px}
.del-btn{min-height:42px;padding:0 16px;border:1px solid var(--red);background:var(--white);color:var(--red-dark);font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:0}
.del-btn:hover{background:var(--red);color:#fff}
/* ---------- pick-list ---------- */
#combo{position:absolute;z-index:80;margin:0;padding:4px 0;list-style:none;background:var(--white);border:1px solid var(--ink);box-shadow:0 8px 22px rgba(0,0,0,.14);max-height:260px;overflow:auto}
#combo li{padding:7px 12px;font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
#combo li:hover,#combo li[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
#combo li.cur{box-shadow:inset 3px 0 0 var(--red)}
/* ---------- portal v2 ---------- */
.checkline{font-size:12.5px;margin:-6px 0 14px;padding:6px 10px;border-left:3px solid var(--ok);background:var(--white)}
.checkline.warn{border-left-color:var(--amber-edge);background:var(--amber-tint)}
.rangebar select,.frail select{min-height:38px;border:1px solid var(--line-strong);border-radius:0;background:var(--white);padding:0 8px;font-family:var(--mono);font-size:13px;color:var(--ink)}
.frail .daterange select{width:100%;font-size:12px;padding:0 4px}
.kpis.pk.small{padding:0 12px;margin-bottom:12px}
.kpis.pk.small .kpi{padding:7px 18px 7px 0;margin-right:18px}
.kpis.pk.small .kpi b{font-size:18px}.kpis.pk.small .kpi span{font-size:9.5px}
.gapnote{font-size:12px;color:var(--muted);margin:-6px 0 12px;border-left:3px solid var(--line-strong);padding-left:10px}
.defn{font-size:12px;line-height:1.5;color:var(--muted);margin:12px 0 0;border-top:1px solid var(--line-soft);padding-top:10px}
.chart .b-ink{fill:var(--ink)}.chart .b-red{fill:var(--red)}.chart .b-grey{fill:var(--faint);opacity:.55}
.chart .ln.ink{stroke:var(--ink)}.chart .ln.red{stroke:var(--red)}.chart .pt.ink{fill:var(--ink)}.chart .pt.red{fill:var(--red)}
.chart .ax.red{fill:var(--red-dark)}
.chartwrap svg{max-width:100%;height:auto}
.legend2 i.ink{background:var(--ink)}.legend2 i.red{background:var(--red)}
table.mini th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:0 4px 6px;border-bottom:1px solid var(--line-strong)}
table.mini th.num,table.mini td.num{text-align:right}
table.mini td.mono{font-family:var(--mono);font-weight:700;font-size:12.5px}
.groupby{display:flex;align-items:center;gap:10px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2)}
.groupby select,.itempick select{min-height:38px;border:1px solid var(--ink);border-radius:0;background:var(--white);padding:0 10px;font-family:var(--sans);font-size:14px;color:var(--ink);letter-spacing:0;text-transform:none}
.itempick{margin-bottom:12px}.itempick select{font-family:var(--mono);font-weight:700;min-width:260px}
table.log tr.grp td{background:var(--surface);border-bottom:1px solid var(--line);cursor:pointer;padding:9px 6px}
table.log tr.grp:hover td{background:var(--line-soft)}
table.log tr.grp .caret{display:inline-block;width:16px;color:var(--muted)}
table.log tr.grp .cnt{margin-left:10px;font-size:11px;color:var(--muted-2)}
table.log tr.sub td:first-child{padding-left:26px}
.insights{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.insight{text-align:left;border:1px solid var(--line);border-left:4px solid var(--line-strong);background:var(--white);padding:12px 14px;cursor:pointer;color:var(--ink);border-radius:0}
.insight:hover{border-color:var(--ink)}
.insight.v-good{border-left-color:var(--ok)}.insight.v-ok{border-left-color:var(--steel)}.insight.v-watch{border-left-color:var(--amber-edge)}.insight.v-bad{border-left-color:var(--red)}
.insight .ih{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.insight .ih b{font-family:var(--cond);font-size:16px;letter-spacing:.08em;text-transform:uppercase}
.insight .ih span{font-size:11px;color:var(--muted-2);font-family:var(--mono)}
.insight .iv{font-weight:600;margin:6px 0 4px;font-size:14px}
.insight p{margin:3px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted)}
table.use td.topshare{font-weight:700}
td.small{font-size:11.5px!important}
td.better{font-weight:700;color:var(--ok)}
tr.bestrow td{background:rgba(46,125,82,.07)}
.tagbest{margin-left:8px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);border:1px solid var(--ok);padding:1px 5px}
.wbcard{margin-top:18px}
.wbline{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.wbline .save-btn{min-height:40px;padding:0 18px;font-size:13.5px}
/* ===== Planning ===== */
#page-planning{padding:0 24px 40px}
.pl-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 0 14px}
.pl-wrap{display:flex;flex-direction:column;gap:0}
.pl-weeks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:1200px){.pl-weeks{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.pl-weeks{grid-template-columns:repeat(2,minmax(0,1fr))}#page-planning{padding:0 12px 32px}}
.pl-week{text-align:left;background:var(--white);border:1px solid var(--line);border-radius:0;padding:12px 12px 10px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:8px}
.pl-week:hover{border-color:var(--line-strong)}
.pl-week.sel{border-color:var(--ink);box-shadow:inset 0 3px 0 var(--red)}
.pl-wk-h{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.pl-wk-h b{font-family:var(--cond);font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.pl-bar{height:8px;background:var(--surface);display:flex;overflow:hidden}
.pl-bar i{display:block;height:100%}.pl-bar i.rec{background:var(--steel)}.pl-bar i.sch{background:var(--ink)}
.pl-week dl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:0;font-size:12.5px}
.pl-week dt{color:var(--muted)}.pl-week dd{margin:0;text-align:right;font-family:var(--mono);font-weight:700}
.pl-week .bad{color:var(--red-dark)}.pl-week dd.good{color:var(--ok)}
.pl-mix{font-size:11px;color:var(--muted-2)}
.pl-chip{display:inline-block;padding:2px 7px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line-strong);color:var(--muted);background:var(--white);white-space:nowrap}
.pl-chip.ok{border-color:var(--ok);color:var(--ok)}.pl-chip.amber{border-color:var(--amber-edge);background:var(--amber-tint);color:var(--amber)}
.pl-chip.red{border-color:var(--red);background:var(--red-tint);color:var(--red-dark)}.pl-chip.steel{border-color:var(--steel-edge);background:var(--steel-tint);color:var(--steel)}
.pl-cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.pl-cols{grid-template-columns:1fr}}
.pl-cols .card{margin:0 0 16px}
.card-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pl-table td{padding:2px 6px;font-size:13px;white-space:nowrap}
.pl-table td.mono,.pl-row .mono{font-family:var(--mono);font-size:12.5px}
.muted-row td{opacity:.55}
.pl-qty{width:82px;min-height:32px;border:1px solid var(--line-strong);border-radius:0;background:var(--field);color:var(--ink);padding:0 6px;font-family:var(--mono);font-size:13px;text-align:right}
.pl-link{background:none;border:0;padding:4px 6px;color:var(--steel);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.pl-link:hover{color:var(--ink)}
.pl-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pl-tools input[type=search]{flex:1;min-width:180px;min-height:38px;border:1px solid var(--line-strong);border-radius:0;padding:0 8px;background:var(--field);color:var(--ink)}
.pl-tools select,.pl-fgrid select,.pl-fgrid input{min-height:38px;border:1px solid var(--line-strong);border-radius:0;background:var(--white);color:var(--ink);padding:0 8px;font-size:13px}
.pl-check{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.pl-list{max-height:640px;overflow-y:auto;border-top:1px solid var(--line)}
.pl-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line-soft)}
.pl-row.rec{opacity:.7}
.pl-row-main{min-width:0;font-size:13px}
.pl-row-main .muted,.pl-table .muted{color:var(--muted-2)}
.pl-row-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-top:3px}
.pl-row-meta .est{color:var(--amber)}.pl-row-meta .bad{color:var(--red-dark)}
.pl-row-act{display:flex;gap:6px;align-items:center;flex-shrink:0}
.pl-row-act .ghost-btn{min-height:32px;padding:0 10px}
.pl-cap summary{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;cursor:pointer;list-style:none;margin-bottom:6px}
.pl-cap summary::before{content:"+";font-family:var(--mono);color:var(--muted)}.pl-cap[open] summary::before{content:"–"}
.pl-drop{padding:34px 20px 30px;margin-bottom:10px}
.pl-got{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pl-review .kpis{margin:6px 0 10px;padding:0 12px}
.pl-issue{margin:8px 0;padding:8px 10px;background:var(--field)}
.pl-issue summary{cursor:pointer}
.pl-issue td{font-size:12px;padding:2px 6px;height:28px}
.pl-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.pl-fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.pl-fgrid label,.pl-inline{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pl-fgrid .seg{height:38px}.pl-fgrid .seg button{height:36px;font-size:13px;padding:0 10px}
.pl-inline{max-width:220px;margin-bottom:10px}
.pl-acts{white-space:nowrap}
.card-head .save-btn{min-height:40px;padding:0 16px;font-size:13.5px}
.card-head label.ghost-btn{display:inline-flex;align-items:center}
/* workspace switch: Production Tracking | Planning */
.workspace{display:flex;background:#1d1f20;padding:0 16px;gap:2px}
.workspace button{min-height:38px;padding:0 20px;border:0;border-radius:0;background:transparent;color:#a3a3a7;font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent}
.workspace button:hover{color:#fff}
.workspace button[aria-current="page"]{color:#fff;border-bottom-color:var(--red)}
@media (max-width:640px){.workspace button{padding:0 12px;font-size:12.5px;letter-spacing:.08em}}
.pl-title{font-family:var(--cond);font-weight:600;font-size:22px;letter-spacing:.08em;text-transform:uppercase;margin:0}
.note.amber{border-left-color:var(--amber-edge);background:var(--amber-tint)}
/* backlog explorer */
.pl-bk-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pl-bk-tools input[type=search]{flex:1;min-width:260px;min-height:42px;border:1px solid var(--ink);border-radius:0;padding:0 10px;background:var(--white);color:var(--ink);font-size:14px}
.pl-bk-tools select,.pl-range input,.pl-addline select{min-height:42px;border:1px solid var(--line-strong);border-radius:0;background:var(--white);color:var(--ink);padding:0 8px;font-size:13px}
.pl-range{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.pl-bk-kpis{margin:0 0 12px;padding:0 12px}
.pl-bk{padding:8px 12px 14px}
.pl-orders th.sortable{cursor:pointer}
.pl-orders td{padding:2px 8px;font-size:13px;white-space:nowrap}
.pl-orders td.bad{color:var(--red-dark);font-weight:600}
.pl-orders td .pl-chip{margin-right:4px}
.pl-ord{cursor:pointer}
.pl-ord:hover td{background:var(--field)}
.pl-ord.open td{background:var(--steel-tint);border-bottom-color:transparent}
.pl-caret{width:18px;color:var(--muted);font-size:11px}
.pl-ord-body>td{background:var(--steel-tint);padding:4px 14px 14px 30px!important;height:auto;white-space:normal}
.pl-info{display:flex;flex-wrap:wrap;gap:4px 18px;margin:6px 0 10px;font-size:12px}
.pl-info dt{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10px;align-self:center}
.pl-info dd{margin:0 8px 0 -12px;font-weight:600}
.pl-lines{background:var(--white)}
.pl-lines td{padding:4px 8px;font-size:12.5px;height:auto;vertical-align:middle}
.pl-lines td.pl-desc{white-space:normal;color:var(--muted);min-width:260px;max-width:520px}
.pl-lines tr.hit-line td{background:var(--amber-tint)}
.pl-sub{font-family:var(--sans);font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}.pl-sub.amber{color:var(--amber)}
.pl-addline{display:inline-flex;gap:6px;align-items:center}.pl-addline select{min-height:32px}.pl-addline .ghost-btn{min-height:32px;padding:0 10px}
.pl-ord-acts{margin-top:8px}
/* week detail: fits without scrolling, with totals */
.pl-wk-table{width:100%;table-layout:fixed}
.pl-wk-table td{padding:4px 6px;font-size:13px;height:auto;white-space:normal;overflow-wrap:anywhere;vertical-align:middle}
.pl-wk-table td.num{white-space:nowrap}
.pl-wk-table td.mono{font-family:var(--mono);font-size:12px}
.pl-cust{white-space:normal!important;line-height:1.3}
.pl-act{text-align:right;white-space:nowrap}
.pl-qty.sm{width:72px;min-height:30px}
.pl-wk-table tfoot td{border-bottom:0;padding:6px;font-size:13px}
.pl-wk-table tr.pl-sub-tot td{color:var(--muted);font-size:12.5px;padding:3px 6px}.pl-wk-table tr.pl-sub-tot.first td{border-top:1px solid var(--line-strong);padding-top:8px}
.pl-wk-table tr.pl-tot td{font-weight:700;font-family:var(--cond);font-size:16px;letter-spacing:.04em;text-transform:uppercase;background:var(--surface)}
.pl-wk-table tr.pl-tot td.num{font-family:var(--mono);font-size:14px}
.pl-wk-table tr.pl-tot-room td{color:var(--ok);font-weight:600}.pl-wk-table tr.pl-tot-room.over td{color:var(--red-dark)}
.pl-wk-table tr.pl-tot-room td:first-child{color:var(--muted);font-weight:500}
/* badges */
.pl-badge{display:inline-block;padding:3px 9px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border:1px solid;white-space:nowrap;line-height:1.3}
.pl-badge.green{color:var(--ok);border-color:var(--ok)}.pl-badge.green.solid{background:var(--ok);color:#fff}
.pl-badge.steel{color:var(--steel);border-color:var(--steel-edge);background:var(--steel-tint)}.pl-badge.steel.solid{background:var(--steel);border-color:var(--steel);color:#fff}
.pl-badge.red{color:var(--red-dark);border-color:var(--red);background:var(--red-tint)}.pl-badge.red.solid{background:var(--red);border-color:var(--red);color:#fff}
.pl-badge.amber{color:var(--amber);border-color:var(--amber-edge);background:var(--amber-tint)}
@media (prefers-color-scheme:dark){.pl-badge.green.solid,.pl-badge.steel.solid{color:#17191a}}
.pl-red{color:var(--red-dark);font-weight:600}
.pl-orders{width:100%;table-layout:fixed}
.pl-orders td{white-space:normal;padding:4px 6px;height:auto;vertical-align:middle}
.pl-orders td.b,.pl-orders .mono.b{font-weight:700}
.pl-orders td.mono{font-family:var(--mono);font-size:12.5px}
.pl-lines{width:100%;table-layout:fixed}
.pl-lines td.pl-desc{min-width:0;max-width:none}
.sm{font-size:11px}
/* backlog page */
.pl-bkt{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0 6px}
.pl-bkt th{text-align:left;font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 12px 2px}

.pl-bk-ord td{background:var(--white);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px;font-size:14px;vertical-align:middle;cursor:pointer}
.pl-bk-ord td:first-child{border-left:4px solid var(--line-strong);padding-left:10px}

.pl-bk-ord td.num{text-align:right;font-family:var(--mono)}
.pl-so{font-family:var(--mono);font-weight:700;font-size:13.5px}
.pl-big{font-weight:700;font-size:15px!important}
.pl-esd{font-family:var(--mono);font-size:13px;margin-right:8px}
.pl-bk .pl-ord-body>td{background:var(--white);border:1px solid var(--line);border-top:0;border-left:4px solid var(--red);padding:0 14px 14px!important}
.pl-bk.card{background:transparent;padding:0}
.pl-drop-panel{border-top:1px dashed var(--line-strong);padding-top:12px}
.pl-info2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}

.pl-bk .pl-lines td{white-space:normal}
.pl-rec-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

.pl-target-room{font-family:var(--mono);font-size:12.5px;font-weight:700;color:#8fd6a8;padding:0 8px}.pl-target-room.over{color:#ff8a8f}
.pl-hint{font-size:12px;color:var(--muted-2);margin:-2px 0 10px}
.pl-bk-tools{margin-bottom:10px}
.pl-bk-tools input[type=search]{border-color:var(--line-strong);background:var(--field)}
.pl-bk-tools input[type=search]:focus{border-color:var(--ink);background:var(--white);outline:none}
.pl-bkt{border-spacing:0 5px}

.pl-bkt th.addcol,.pl-lt th.addcol{color:var(--red-dark)}
.pl-bk-ord td{padding:0 10px;height:52px;font-size:14px;border-color:var(--line-soft);transition:background .12s}
.pl-bk-ord td:first-child{border-left:3px solid transparent;padding-left:12px}
.pl-bk-ord:hover td{background:var(--field)}
.pl-bk-ord:hover td:first-child{border-left-color:var(--line-strong)}
.pl-bk-ord.open td{background:var(--white)}
.pl-bk-ord.open td:first-child{border-left-color:var(--red)}
.pl-bk-ord.flash td{animation:plflash 2s ease-out}
@keyframes plflash{0%,40%{background:var(--amber-tint)}100%{background:var(--white)}}
.pl-caret{color:var(--faint);font-size:10px}
.pl-cust{font-weight:500}
.pl-esd{font-family:var(--mono);font-size:13px;white-space:nowrap}.pl-esd.past{color:var(--red-dark);font-weight:700}
.pl-pastcell,.pl-schedcell{text-align:left}
.pl-pastcell .pl-badge{min-width:76px;text-align:center}
.pl-schedcell .pl-badge{min-width:82px;text-align:center}
.pl-addcell{text-align:right;white-space:nowrap}
.pl-addbox{display:inline-flex;align-items:stretch;border:1px solid var(--ink);background:var(--white)}
.pl-addqty{width:96px;height:34px;border:0;border-radius:0;background:transparent;color:var(--ink);padding:0 8px;font-family:var(--mono);font-size:13.5px;font-weight:700;text-align:right}
.pl-addqty::placeholder{color:var(--faint);font-weight:500;font-family:var(--sans);font-size:12px}
.pl-addqty:focus{outline:none;background:var(--field)}
.pl-addbtn{height:34px;padding:0 16px;border:0;border-left:1px solid var(--ink);border-radius:0;background:var(--red);color:#fff;font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.pl-addbtn:hover{background:var(--red-dark)}
.pl-planbtn{height:32px;padding:0 14px;border:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);font-family:var(--cond);font-weight:600;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.pl-planbtn:hover{background:var(--ink);color:var(--on-ink)}
.pl-ord-body>td{padding:0 18px 18px 22px!important}
.pl-bk .pl-ord-body>td,.pl-pk .pl-ord-body>td{background:var(--white);border:1px solid var(--line-soft);border-top:0;border-left:3px solid var(--red)}
.pl-drop-panel{border-top:1px solid var(--line-soft);padding-top:14px}
.pl-info2{gap:6px;margin-bottom:14px}
.pl-info2>div{background:var(--paper);border:0;padding:8px 12px}
.pl-lt{width:100%;table-layout:fixed;border-collapse:collapse}
.pl-lt th{text-align:left;font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 8px 6px;border-bottom:1px solid var(--line-strong)}
.pl-lt th.num{text-align:right}
.pl-lt td{padding:9px 8px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle}
.pl-lt td.num{text-align:right;font-family:var(--mono)}.pl-lt td.b{font-weight:700}
.pl-lt td.mono{font-family:var(--mono);font-size:12.5px;font-weight:600}
.pl-lt td.pl-desc{color:var(--muted);font-size:12.5px;line-height:1.35}
.pl-lt td.muted{color:var(--muted);font-size:12px}
.pl-lt tr:last-child td{border-bottom:0}
.pl-lt tr.hit-line td{background:var(--amber-tint)}
.pl-fit{font-size:11px;color:var(--ok);margin-top:2px}.pl-fit.no{color:var(--red-dark)}
.pl-ord-acts{display:flex;gap:14px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
.pl-detail{border:1px solid var(--line)}
.pl-week{border-color:var(--line-soft)}
@media (max-width:900px){.pl-bkt col:nth-child(6),.pl-bkt th:nth-child(6),.pl-bkt td:nth-child(6){display:none}.pl-target{width:100%}}
/* ===== round 3: alignment, bolder headers, clearer controls ===== */
/* bolder, darker table headers across the whole portal */
.grid th,table.mini th{font-size:11px!important;font-weight:700!important;letter-spacing:.1em!important;color:var(--ink)!important}
.pl-bkt th,.pl-lt th{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink)}
.pl-bkt th.addcol,.pl-lt th.addcol{color:var(--red-dark)}
/* alignment: header and cell share the same class and padding */
.pl-bkt th,.pl-bkt td{padding-left:10px;padding-right:10px}
.pl-bkt th.num,.pl-bkt td.num,.pl-lt th.num,.pl-lt td.num{text-align:right}
.pl-bkt th.ctr,.pl-bkt td.ctr{text-align:center}
.pl-bkt td.pl-addcell{text-align:right}
.pl-bk-ord td:first-child{padding-left:7px}
.pl-lt th,.pl-lt td{padding-left:10px;padding-right:10px}
/* item: code + readable spec */
.pl-item b{display:block;font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--ink)}
.pl-item span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
/* row actions: Add + Recurring */
.pl-rowacts{display:inline-flex;gap:8px;align-items:center;justify-content:flex-end}
.pl-recbtn{height:36px;padding:0 12px;border:1px solid var(--steel);border-radius:0;background:transparent;color:var(--steel);font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.pl-recbtn:hover,.pl-recbtn.on{background:var(--steel);color:#fff}
@media (prefers-color-scheme:dark){.pl-recbtn:hover,.pl-recbtn.on{color:#17191a}}
.pl-addbox{height:36px}.pl-addqty,.pl-addbtn{height:34px}
/* Adding to: week chips */
.pl-target{background:transparent;color:var(--ink);padding:0;flex-direction:column;align-items:flex-end;gap:6px}
.pl-target-l{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--red-dark)}
.pl-wkchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pl-wkchip{display:flex;flex-direction:column;align-items:center;gap:0;min-width:84px;padding:6px 10px 5px;border:1px solid var(--line-strong);border-radius:0;background:var(--white);color:var(--ink);cursor:pointer;transition:border-color .12s,background .12s}
.pl-wkchip .d{font-family:var(--cond);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pl-wkchip b{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--ok);line-height:1.25}
.pl-wkchip .s{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2)}
.pl-wkchip:hover{border-color:var(--ink)}
.pl-wkchip.over b{color:var(--red-dark)}
.pl-wkchip.sel{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--red)}
.pl-wkchip.sel .d,.pl-wkchip.sel .s{color:var(--on-ink);opacity:.8}
.pl-wkchip.sel b{color:#8fd6a8}.pl-wkchip.sel.over b{color:#ff8a8f}
@media (max-width:900px){.pl-target{align-items:flex-start}.pl-wkchips{justify-content:flex-start}.pl-wkchip{min-width:72px}}
/* week detail */
.pl-caps{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.pl-wk-table tr.pl-sub-tot td{font-size:14px;font-weight:700;color:var(--ink);padding:9px 6px;background:var(--field)}
.pl-wk-table tr.pl-sub-tot.first td{border-top:2px solid var(--ink);padding-top:9px}
.pl-wk-table tr.pl-sub-tot td.num{font-family:var(--mono);font-size:14.5px}
.pl-wk-table .sw{display:inline-block;width:12px;height:12px;margin-right:10px;vertical-align:-1px}
.pl-wk-table .sw.rec{background:var(--steel)}.pl-wk-table .sw.sch{background:var(--ink)}
.pl-wk-table tr.pl-tot td{background:var(--ink);color:var(--on-ink);font-size:17px;padding:10px 6px}
.pl-wk-table tr.pl-tot td.num{font-size:15.5px}
.pl-wk-table tr.pl-tot-room td{padding:9px 6px;font-size:14px}
/* inline recurring form inside an order */
.pl-form.inline{margin:0 0 14px;border:1px solid var(--steel-edge);background:var(--steel-tint);padding:14px 16px}
.pl-form.inline .card-head{margin-bottom:10px}
.pl-fixed{font-size:15px;line-height:38px}
.pl-fgrid label>span,.pl-inline>span{font-weight:700;color:var(--ink)}
/* capacity variability */
.pl-sd{border:1px solid var(--line);background:var(--paper);padding:14px 16px;margin:4px 0 16px}
.pl-sd-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.pl-sd-h h3{margin:0;font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
.pl-sdsel{min-height:34px;border:1px solid var(--line-strong);border-radius:0;background:var(--white);color:var(--ink);padding:0 8px;font-size:13px}
.pl-sd-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:12px}
.pl-sd-tiles>div{background:var(--white);border:1px solid var(--line-soft);padding:9px 12px;display:flex;flex-direction:column;gap:1px}
.pl-sd-tiles>div.hl{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--red)}
.pl-sd-tiles span{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pl-sd-tiles b{font-family:var(--mono);font-size:19px;font-weight:700}
.pl-sd-tiles em{font-style:normal;font-size:11.5px;color:var(--muted-2)}
.pl-sd-plan{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pl-sd-plan .lbl{font-family:var(--cond);font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red-dark)}
.pl-sdseg{display:inline-flex;border:1px solid var(--ink)}
.pl-sdseg button{height:34px;padding:0 13px;border:0;border-left:1px solid var(--line-strong);border-radius:0;background:var(--white);color:var(--ink);font-family:var(--cond);font-weight:700;font-size:13.5px;letter-spacing:.06em;cursor:pointer}
.pl-sdseg button:first-child{border-left:0}
.pl-sdseg button:hover{background:var(--field)}
.pl-sdseg button.on{background:var(--ink);color:var(--on-ink)}
.pl-sd-why{flex:1;min-width:240px;font-size:12.5px;color:var(--muted)}
.pl-warn{color:var(--amber)!important;margin:10px 0 0}
.pl-week dt.pl-sdrow,.pl-week dd.pl-sdrow{font-size:11px;color:var(--muted-2);font-weight:500}

/* sign-in */
.authgate{position:fixed;inset:0;z-index:1000;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
body.signed-out>*:not(.authgate):not(#toast){display:none!important}
.auth-card{width:min(380px,100%);background:var(--white);border:1px solid var(--line);border-top:4px solid var(--red);padding:28px 28px 22px;display:flex;flex-direction:column;gap:14px}
.auth-brand{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--red-dark)}
.auth-card h1{margin:0 0 4px;font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase}
.auth-card label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.auth-card input{min-height:44px;border:1px solid var(--line-strong);border-radius:0;background:var(--field);color:var(--ink);padding:0 12px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:400}
.auth-card input:focus{outline:none;border-color:var(--ink);background:var(--white)}
.auth-card .save-btn{min-height:46px;margin-top:4px}
.auth-link{background:none;border:0;color:var(--steel);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;align-self:flex-start;padding:0}
.auth-msg{min-height:18px;font-size:13px;color:var(--red-dark)}.auth-msg.ok{color:var(--ok)}
.whoami{font-size:12px;color:var(--muted);margin-right:4px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth-out{background:none;border:1px solid var(--line-strong);border-radius:0;color:var(--ink);font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;height:34px;padding:0 12px;margin-right:6px;cursor:pointer}
.auth-out:hover{border-color:var(--ink)}
@media (max-width:760px){.whoami{display:none}}

function fixText(f, why) {

  if (/geometric key/.test(why)) return why.replace(/^diameter/, "Diameter").replace(" isn't in the geometric key", " isn't in the key");
  if (/more than one match/.test(why)) return `Item has ${why}`;
  if (/add the Elbow Production Log/.test(why)) return "Item can't be checked until the item list is loaded";

function fixList(rep) {

  const twin = twinOf(rep);
  if (twin) list.push(["Bender", `Two bender ${rep.bender} ${rep.shift === 1 ? "day" : "night"} shift sheets this day (pages ${Math.min(rep.page, twin.page)} and ${Math.max(rep.page, twin.page)}). Fix the number or leave one out`, focusBender]);
  for (const [who, what] of (rep.orderFlags || [])) list.push([who, what, who === "Bender" ? focusBender : null]);
  if (rep.duplicate) list.push(["Bender", `Already in the portal for ${L.fmtDate(dateOf(rep))}, ${rep.shift === 1 ? "day" : "night"} shift`, focusBender]);
  if (rep.readDate && dateOf(rep) && rep.readDate !== dateOf(rep)) list.push(["Date", `Sheet reads ${L.fmtDate(rep.readDate)}, logging as ${L.fmtDate(dateOf(rep))}`, null]);

async function saveImport(rows) {
  const stamp = new Date();
  const dates = [...new Set(rows.map(x => x.date))].sort();
  const span = dates.length > 1 ? `${dates[0]}_to_${dates[dates.length - 1]}` : dates[0];
  const name = `Elbow_Import_${span}_${String(stamp.getHours()).padStart(2, "0")}${String(stamp.getMinutes()).padStart(2, "0")}.json`;
  const data = JSON.stringify({ format: "elbow-import-v1", created: stamp.toISOString(), date: dates[0],
    sources: [...new Set(ST.files.map(f => f.name))],
    rows: rows.map(x => ({ date: x.date, shift: x.shift, bender: x.bender, item: x.item, so: x.so, units: x.units,
                           rejects: x.rej, start: x.start, end: x.end, source: `${x.file} p${x.page}` })) }, null, 1);
  const b = $("#savebtn"), label = b ? b.textContent : "";
  if (b) { b.disabled = true; b.textContent = "Sending..."; }
  if (ST.downloads === undefined) ST.downloads = await claude.use("downloads").catch(() => null);
  if (!ST.downloads) { if (b) { b.disabled = false; b.textContent = label; } showFallback(name, data); return; }
  try {
    await ST.downloads.save({ filename: name, data });
    ST.exported = name; saveSession();
    if (b) b.textContent = "Imported";
    showSaved();
  } catch (e) {
    if (b) { b.disabled = false; b.textContent = label; }
    if (e && e.code === "declined") toast("Import cancelled. Click Import to Excel when you're ready.");
    else if (e && e.code === "rate_limited") toast("Already waiting for you to allow it.");
    else showFallback(name, data);
  }
}

/* ---------------- wiring ---------------- */
function init() {
  loadItemsCache(); loadSession();
  if (ST.items.size) fillItemList();
  const drop = $("#drop"), pick = $("#pick");
  pick.addEventListener("change", () => { addFiles([...pick.files]); pick.value = ""; });
  drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick.click(); } });
  for (const ev of ["dragenter", "dragover"]) drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); });
  for (const ev of ["dragleave", "drop"]) drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); });
  drop.addEventListener("drop", e => addFiles([...(e.dataTransfer?.files || [])]));
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", e => {
    e.preventDefault(); if (drop.contains(e.target)) return;
    const fl = [...(e.dataTransfer?.files || [])];
    const wbs = fl.filter(f => /\.xlsx?m?$/i.test(f.name));
    if (ST.step === "upload") addFiles(fl);
    else if (wbs.length) addFiles(wbs);                    // the workbook can be added at any point
  });

  $("#go").addEventListener("click", startBatch);
  $("#tofinal").addEventListener("click", goFinal);
  $("#zclose").addEventListener("click", closeZoom);
  $("#zfit").addEventListener("click", () => { const i = $("#zimg"); const fit = i.style.width !== "100%"; i.style.width = fit ? "100%" : "2200px"; $("#zfit").textContent = fit ? "Actual size" : "Fit"; });
  $("#lbstage").addEventListener("click", e => { if (e.target.id === "lbstage") closeZoom(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#lightbox").classList.contains("hidden")) closeZoom(); });
  let armed = null;
  $("#newbatch").addEventListener("click", () => {
    const b = $("#newbatch");
    if (armed) { clearTimeout(armed); armed = null; b.textContent = "New batch"; newBatch(); return; }
    b.textContent = "Discard review?"; armed = setTimeout(() => { armed = null; b.textContent = "New batch"; }, 4000);
  });
  setStep("upload"); renderUpload();
  if (window.claude && claude.use) {
    claude.use("sample").then(async s => {
      ST.sample = s || null;
      if (s) {
        const lim = await s.limits().catch(e => ({ error: e && e.code || "failed" }));
        ST.limitsInfo = lim?.error ? `limits check failed (${lim.error})` : lim?.images ? `up to ${lim.images.maxCount} images` : "viewer reported no image support";
        if (lim?.images?.maxCount) ST.maxImages = lim.images.maxCount;   // otherwise just try with 5
      }
      renderUpload();
    }).catch(() => { ST.sample = null; renderUpload(); });
    claude.use("downloads").then(d => { ST.downloads = d || null; }).catch(() => { ST.downloads = null; });

function verdict(a, shop) {

  if (slow && !hard) lines.push("Slower even without hard parts: look at downtime, part changes and material for this bender.");

        h("datalist", { id: "pl-orders" }, ...orders.map(([s, ls]) => h("option", { value: `${s} — ${ls[0].cust}` }))),
        h("label", {}, h("span", {}, "Reserve"), h("div", { class: "seg" }, ...[["general", "General quantity"], ["item", "Specific items"]].map(([k, l]) => h("button", { "aria-pressed": f.mode === k ? "true" : "false", onclick: () => set("mode", k) }, l)))),
        h("label", {}, h("span", {}, "Every"), h("select", { onchange: e => set("cadence", +e.target.value) }, ...[1, 2, 3, 4].map(n => h("option", { value: n, selected: f.cadence === n ? true : null }, n === 1 ? "Week" : `${n} weeks`)))),
        h("label", {}, h("span", {}, "First week"), h("select", { onchange: e => set("start", e.target.value) }, ...[...new Set([f.start, ...W].filter(Boolean))].sort().map(w => h("option", { value: w, selected: f.start === w ? true : null }, "Week of " + wkLabel(w))))),
        h("label", {}, h("span", {}, "Stop after (optional)"), h("input", { type: "date", value: f.end || "", onchange: e => set("end", e.target.value ? monday(e.target.value) : "") }))),
      so && !lines.length ? h("p", { class: "note red" }, `${so} has no elbow lines in the current backlog.`) : null,
      lines.length ? h("p", { class: "save-note" }, `${lines[0].cust} · ${lines.length} elbow line${lines.length === 1 ? "" : "s"} · ${fmt(lines.reduce((a, l) => a + l.qty, 0))} elbows left · ship ${dLabel(lines[0].ship)}`) : null,
      lines.length && f.mode === "general" ? h("label", { class: "pl-inline" }, h("span", {}, "Elbows per cycle"), h("input", { type: "number", min: "1", value: f.qty || "", class: "pl-qty", onchange: e => set("qty", +e.target.value || "") })) : null,
      lines.length && f.mode === "item" ? h("div", { class: "tw" }, h("table", { class: "grid data" },
        h("thead", {}, h("tr", {}, ...["", "Item", "Left", "Per cycle", "Rate guide"].map((x, i) => h("th", { class: i === 2 || i === 3 ? "num" : "" }, x)))),
        h("tbody", {}, ...lines.map(l => { const r = rate(l.bend), on = f.items.has(l.key);
          return h("tr", {}, h("td", {}, h("input", { type: "checkbox", checked: on ? true : null, onchange: e => { e.target.checked ? f.items.set(l.key, f.items.get(l.key) || Math.min(l.qty, 100)) : f.items.delete(l.key); render(); } })),
            h("td", { class: "mono" }, l.item), h("td", { class: "num" }, fmt(l.qty)),
            h("td", { class: "num" }, on ? h("input", { type: "number", min: "1", value: f.items.get(l.key), class: "pl-qty", onchange: e => { f.items.set(l.key, +e.target.value || 1); render(); } }) : ""),
            h("td", { class: "muted" }, r ? `≈ ${(60 / r.min).toFixed(1)}/bender-hr${r.est ? " (estimate)" : ""}` : "")); })))) : null,
      mixNote(),
      h("div", { class: "pl-actions" },
        h("button", { class: "save-btn", onclick: submitRec }, "Save"), h("button", { class: "ghost-btn", onclick: () => { S.form = null; render(); } }, "Cancel")));
  }
  async function submitRec() {
    const f = S.form; if (!f.so || !S.bySo.has(f.so)) return toast("Choose an order that's in the backlog.");
    if (!f.editing && S.rec.has(f.so)) return toast(`${f.so} already has a recurring entry — edit that one.`);
    if (f.mode === "general" && !(+f.qty > 0)) return toast("Enter the elbows per cycle.");
    if (f.mode === "item" && !f.items.size) return toast("Pick at least one item.");
    const r = { so: f.so, mode: f.mode, qty: f.mode === "general" ? +f.qty : null, items: f.mode === "item" ? [...f.items] : [], cadence: f.cadence || 1, start: f.start || weeks()[0], end: f.end || "", active: f.active !== false, skips: f.skips || [] };
    const inl = f.inline;
    if (await saveRec(r)) { S.rec.set(r.so, r); S.form = null; render(); toast(inl ? `${r.so} is now recurring every ${r.cadence === 1 ? "week" : r.cadence + " weeks"}. It shows in the week cards, and its lines leave the backlog list.` : `Saved recurring order ${r.so}.`); }
  }
  async function importCommitments(file) {
    if (!file || !window.XLSX) return;
    const list = C.parseCommitments(XLSX, XLSX.read(await file.arrayBuffer(), { type: "array" }));
    if (!list.length) return toast("No orders found in that file.");
    const w0 = weeks()[0], pl = list.plan || { offsets: {} }, upd = [], add = [], kept = [];
    for (const x of list) { const r = S.rec.get(x.so); if (!r) add.push(x); else if (r.mode !== "item") upd.push(x); else kept.push(x); }
    const sums = {}; for (const x of list) sums[x.cadence] = (sums[x.cadence] || 0) + x.qty;
    const check = pl.found ? [1, 2, 3, 4].filter(c => pl.totals[c] != null && Math.round(pl.totals[c]) !== Math.round(sums[c] || 0))
      .map(c => ({ cad: c, sheet: pl.totals[c], orders: sums[c] || 0 })) : [];
    const ok = await guard(async db => {
      for (const x of [...add, ...upd]) {
        const old = S.rec.get(x.so) || {}, r = { so: x.so, mode: "general", qty: x.qty, items: [], cadence: x.cadence, start: addDays(w0, 7 * (pl.offsets[x.cadence] || 0)),
          end: old.end || "", active: old.active !== false, skips: old.skips || [] };
        await db.doc(`recurring/${x.so}`).set({ ...r, updatedAt: Date.now() }); S.rec.set(x.so, r);
      }
      if (pl.cap) S.settings.baseCap = pl.cap;
      S.settings.commit = { file: file.name, on: iso(new Date()), week1: w0, check, sums, totals: pl.totals || {}, found: !!pl.found };
      await db.doc("plan/settings").set({ ...S.settings, updatedAt: Date.now() });
    });
    if (ok) { const miss = list.filter(x => !S.bySo.has(x.so)).map(x => x.so);
      toast(`${add.length} added, ${upd.length} updated${kept.length ? `, ${kept.length} specific-item entries left as they were` : ""}.` + (pl.cap ? ` Base capacity set to ${fmt(pl.cap)}.` : "") + (miss.length ? ` Not in backlog: ${miss.join(", ")}.` : "")); render(); }
  }

  window.PlanningPage = { render, state: S };
  // workspace switch: each side reopens on the page you last had open there
  document.querySelectorAll("[data-ws]").forEach(b => b.addEventListener("click", () => {
    const p = P(); EP().show(b.dataset.ws === "plan" ? (p.lastPlan || "plan-week") : (p.lastProd || "overview"));
  }));
})();

</script>
</body>
